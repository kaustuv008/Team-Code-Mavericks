<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <title>PlacePilot — Placement Practice Planner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-base: #f8fafc;
      --surface: #ffffff;
      --surface-subtle: #f1f5f9;
      --border: #e2e8f0;
      --border-dark: #cbd5e1;
      --border-focus: #3b82f6;
      --text-primary: #0f172a;
      --text-secondary: #334155;
      --text-muted: #64748b;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-light: #eff6ff;
      --primary-border: #bfdbfe;

      --prio-high-bg: #fef2f2;
      --prio-high-text: #991b1b;
      --prio-high-border: #fecaca;
      --prio-high-accent: #ef4444;

      --prio-med-bg: #fffbeb;
      --prio-med-text: #92400e;
      --prio-med-border: #fde68a;
      --prio-med-accent: #f59e0b;

      --prio-low-bg: #f0fdf4;
      --prio-low-text: #166534;
      --prio-low-border: #bbf7d0;
      --prio-low-accent: #10b981;

      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
      --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.07), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
      --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg-base);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .navbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: var(--shadow-sm);
    }

    .nav-container {
      max-width: 1240px;
      margin: 0 auto;
      padding: 0 16px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .nav-container {
        padding: 0 24px;
        height: 70px;
      }
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      text-decoration: none;
    }

    .brand-logo {
      width: 36px;
      height: 36px;
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      border-radius: var(--radius-sm);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      box-shadow: 0 2px 4px rgba(37, 99, 235, 0.25);
      flex-shrink: 0;
    }

    .brand-text {
      display: flex;
      flex-direction: column;
    }

    .brand-name {
      font-size: 1.15rem;
      font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.02em;
      line-height: 1.1;
    }

    .brand-name span {
      color: var(--primary);
    }

    .brand-sub {
      font-size: 0.68rem;
      font-weight: 700;
      color: var(--primary);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    /* Desktop Navigation Tabs */
    .nav-tabs {
      display: none;
      align-items: center;
      gap: 6px;
    }

    @media (min-width: 860px) {
      .nav-tabs {
        display: flex;
      }
    }

    .nav-btn {
      padding: 8px 14px;
      border-radius: var(--radius-sm);
      font-size: 0.86rem;
      font-weight: 500;
      color: var(--text-secondary);
      border: 1px solid transparent;
      background: transparent;
      cursor: pointer;
      transition: all 0.15s ease;
      min-height: 40px;
      display: inline-flex;
      align-items: center;
    }

    .nav-btn:hover {
      background: var(--surface-subtle);
      color: var(--text-primary);
    }

    .nav-btn.active {
      background: #eff6ff;
      color: var(--primary);
      font-weight: 600;
      border-color: #dbeafe;
    }

    /* Mobile Hamburger Menu Toggle */
    .mobile-menu-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 44px;
      height: 44px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      cursor: pointer;
      color: var(--text-primary);
    }

    @media (min-width: 860px) {
      .mobile-menu-toggle {
        display: none;
      }
    }

    /* Mobile Drawer */
    .mobile-drawer {
      display: none;
      flex-direction: column;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px 20px;
      gap: 8px;
    }

    .mobile-drawer.open {
      display: flex;
    }

    @media (min-width: 860px) {
      .mobile-drawer {
        display: none !important;
      }
    }

    .user-profile-badge {
      display: none;
      align-items: center;
      gap: 10px;
      padding-left: 14px;
      border-left: 1px solid var(--border);
    }

    .user-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #dbeafe;
      color: var(--primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.8rem;
      font-weight: 700;
      flex-shrink: 0;
    }

    .user-meta {
      display: flex;
      flex-direction: column;
      font-size: 0.75rem;
    }

    .user-name {
      font-weight: 600;
      color: var(--text-primary);
      line-height: 1.2;
    }

    .user-role {
      color: var(--text-muted);
    }

    .app-main {
      flex: 1;
      max-width: 1240px;
      width: 100%;
      margin: 20px auto 40px;
      padding: 0 16px;
    }

    @media (min-width: 768px) {
      .app-main {
        margin: 28px auto 60px;
        padding: 0 24px;
      }
    }

    .toast-banner {
      position: fixed;
      bottom: 20px;
      right: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--primary);
      border-radius: var(--radius-sm);
      padding: 14px 18px;
      box-shadow: var(--shadow-lg);
      z-index: 2000;
      max-width: 380px;
      display: none;
      animation: slideIn 0.25s ease-out;
    }

    @keyframes slideIn {
      from { transform: translateY(20px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    /* Dashboard Layouts */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      align-items: start;
    }

    @media (min-width: 980px) {
      .dashboard-grid {
        grid-template-columns: 280px 1fr;
        gap: 24px;
      }
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 24px;
    }

    @media (min-width: 680px) {
      .stats-row {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
    }

    .stat-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .stat-val {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-primary);
      font-family: 'JetBrains Mono', monospace;
      margin-top: 4px;
    }

    .stat-sub {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      margin-bottom: 24px;
    }

    @media (min-width: 768px) {
      .card {
        padding: 24px;
      }
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--surface-subtle);
      flex-wrap: wrap;
      gap: 8px;
    }

    .card-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--text-primary);
      letter-spacing: -0.01em;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .card-badge {
      font-size: 0.72rem;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 999px;
      background: var(--surface-subtle);
      color: var(--text-secondary);
    }

    /* Form Styles */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="date"],
    select {
      width: 100%;
      min-height: 44px;
      padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      color: var(--text-primary);
      background: var(--surface);
      transition: all 0.15s ease;
    }

    input:focus, select:focus {
      outline: none;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 16px;
      min-height: 42px;
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: all 0.15s ease;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
    }

    .btn-secondary {
      background: var(--surface-subtle);
      color: var(--text-secondary);
      border-color: var(--border);
    }

    .btn-secondary:hover {
      background: #e2e8f0;
      color: var(--text-primary);
    }

    .btn-subtle {
      background: transparent;
      color: var(--text-muted);
      padding: 6px 10px;
      font-size: 0.82rem;
    }

    .btn-subtle:hover {
      color: var(--text-primary);
    }

    .btn-danger {
      color: #dc2626;
      border-color: #fecaca;
      background: #ffffff;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-danger:hover {
      background: #fef2f2;
    }

    .btn-edit {
      color: var(--primary);
      border-color: #bfdbfe;
      background: #ffffff;
      padding: 6px 10px;
      font-size: 0.8rem;
    }

    .btn-edit:hover {
      background: #eff6ff;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge-high {
      background: var(--prio-high-bg);
      color: var(--prio-high-text);
      border: 1px solid var(--prio-high-border);
    }

    .badge-medium {
      background: var(--prio-med-bg);
      color: var(--prio-med-text);
      border: 1px solid var(--prio-med-border);
    }

    .badge-low {
      background: var(--prio-low-bg);
      color: var(--prio-low-text);
      border: 1px solid var(--prio-low-border);
    }

    .queue-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .queue-item {
      padding: 14px 16px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-left-width: 4px;
      border-radius: var(--radius-sm);
      display: flex;
      gap: 14px;
      align-items: flex-start;
      box-shadow: var(--shadow-sm);
    }

    .queue-item.high { border-left-color: var(--prio-high-accent); }
    .queue-item.medium { border-left-color: var(--prio-med-accent); }
    .queue-item.low { border-left-color: var(--prio-low-accent); }

    .queue-rank {
      font-family: 'JetBrains Mono', monospace;
      font-size: 1rem;
      font-weight: 700;
      color: var(--text-muted);
      min-width: 26px;
      padding-top: 1px;
    }

    .queue-body {
      flex: 1;
    }

    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
      flex-wrap: wrap;
    }

    .queue-title {
      font-size: 0.94rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    .queue-reason {
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.45;
    }

    /* Table styling & responsive card transformation */
    .table-container {
      overflow-x: auto;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.86rem;
    }

    th {
      background: #f8fafc;
      padding: 12px 14px;
      font-size: 0.74rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }

    td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text-secondary);
      vertical-align: middle;
      white-space: nowrap;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .table-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
    }

    .external-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      margin-bottom: 24px;
    }

    @media (min-width: 540px) {
      .external-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 980px) {
      .external-grid {
        grid-template-columns: repeat(4, 1fr);
        gap: 16px;
      }
    }

    .external-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }

    .external-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .external-title {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text-primary);
    }

    .external-desc {
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 14px;
      line-height: 1.4;
    }

    .q-filter-tabs {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 6px;
      margin-bottom: 16px;
    }

    .q-filter-tab {
      padding: 7px 14px;
      border-radius: 6px;
      background: var(--surface);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      cursor: pointer;
      white-space: nowrap;
      min-height: 38px;
    }

    .q-filter-tab.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .question-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: var(--shadow-sm);
    }

    .question-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--text-muted);
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 4px;
    }

    .question-stem {
      font-size: 0.94rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 14px;
      line-height: 1.5;
    }

    .option-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }

    @media (min-width: 640px) {
      .option-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    .option-btn {
      padding: 10px 14px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: var(--radius-sm);
      font-size: 0.84rem;
      text-align: left;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.15s ease;
      min-height: 44px;
      display: flex;
      align-items: center;
    }

    .option-btn:hover {
      background: var(--surface-subtle);
    }

    .option-btn.selected {
      border-color: var(--primary);
      background: #eff6ff;
      color: #1e40af;
      font-weight: 600;
    }

    .question-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 12px;
      border-top: 1px solid var(--surface-subtle);
      font-size: 0.8rem;
      flex-wrap: wrap;
      gap: 10px;
    }

    .explanation-box {
      margin-top: 12px;
      padding: 12px 14px;
      background: #f8fafc;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      font-size: 0.82rem;
      color: var(--text-secondary);
      line-height: 1.5;
    }

    .auth-modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(4px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .auth-modal-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 24px;
      width: 100%;
      max-width: 440px;
      box-shadow: var(--shadow-lg);
      position: relative;
      animation: modalPop 0.2s ease-out;
    }

    @media (min-width: 500px) {
      .auth-modal-card {
        padding: 32px;
      }
    }

    @keyframes modalPop {
      from { transform: scale(0.96); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .auth-modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      background: none;
      border: none;
      font-size: 1.35rem;
      color: var(--text-muted);
      cursor: pointer;
      line-height: 1;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .auth-title {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--text-primary);
      margin-bottom: 4px;`
